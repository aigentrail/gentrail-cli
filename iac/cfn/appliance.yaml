AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Gentrail standard installation: ARM64 k3s on one EC2 node, private managed PostgreSQL, retained S3 evidence with Object Lock, and SSM access. Single-AZ application and database; no EKS, NAT gateway or load balancer.
Parameters:
  # >>> GENERATED pii-kms-parameters
  ExistingPiiTokenizationKeyArn:
    Type: String
    Default: ""
    AllowedPattern: ^$|^arn:aws:kms:[a-z0-9-]+:[0-9]{12}:key/[a-zA-Z0-9-]+$
    Description: Optional existing PII tokenization key. Leave empty to create a retained rotating key. Its key policy must allow the dashboard role.
  # <<< GENERATED pii-kms-parameters
  InstanceType:
    Type: String
    Default: t4g.medium
    Description: ARM64 application node. Capacity must be qualified for the selected modules and workload.
    AllowedValues: [t4g.medium, t4g.large, t4g.xlarge, m7g.large, m7g.xlarge]
  RdsBackupRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 35
  EvidenceRetentionDays:
    Type: Number
    Default: 2555
    MinValue: 1
    MaxValue: 36500
  TunnelToken:
    Type: String
    Default: ""
    NoEcho: true
    AllowedPattern: ^$|^[A-Za-z0-9_+/=.-]{1,1000}$
    MaxLength: 1000
    Description: Optional existing Cloudflare Tunnel token. Empty keeps access SSM-only.
  RootVolumeSizeGiB:
    Type: Number
    Default: 50
    MinValue: 30
    Description: Encrypted gp3 root volume; holds images plus all PVC data (local-path).
  LatestAl2023Ami:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: Resolved at deploy time from the public AL2023 SSM alias. Do not override.
  PublicRepoUrl:
    Type: String
    Default: https://github.com/aigentrail/gentrail-cli.git
    Description: The public BYOC repo the node clones to self-install the chart + init specs.
  RepoBranch:
    Type: String
    Default: main
    Description: Branch of the public repo to clone (pin a release branch, or a test branch).
  SelfInstall:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      true (the bash installer): the box installs the chart itself on first boot. false (the gentrail CLI): the box boots bare k3s and the CLI drives the chart install over SSM so it shows as discrete steps.
  LicenseJwt:
    Type: String
    Default: ""
    NoEcho: true
    Description: >-
      Optional license JWT to pre-seed. Leave empty to boot unlicensed and paste the license in the dashboard (the chart seeds an empty license secret).
  VpcCidr:
    Type: String
    # Must not overlap k3s's default pod CIDR 10.42.0.0/16 or service CIDR
    # 10.43.0.0/16: a collision shadows the VPC DNS resolver (.2) behind the pod
    # network, so coredns loop-detects, dies, and cluster DNS goes down.
    Default: 10.20.0.0/16
Conditions:
  # >>> GENERATED pii-kms-conditions
  CreatePiiTokenizationKey:
    Fn::Equals:
      - Ref: ExistingPiiTokenizationKeyArn
      - ""
  # <<< GENERATED pii-kms-conditions
  HasLicense: !Not [!Equals [!Ref LicenseJwt, ""]]
  HasTunnel: !Not [!Equals [!Ref TunnelToken, ""]]
  SelfInstallEnabled: !Equals [!Ref SelfInstall, "true"]
Resources:
  # >>> GENERATED pii-kms-policy
  PiiTokenizationKey:
    Type: AWS::KMS::Key
    Condition: CreatePiiTokenizationKey
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Gentrail PII tokenization data keys
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountKeyAdministration
            Effect: Allow
            Principal:
              AWS:
                Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
  DashboardPiiKmsPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: pii-tokenization
      Roles:
        - Ref: DashboardIrsaRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PiiTokenization
            Effect: Allow
            Action:
              - kms:GenerateDataKey
              - kms:Decrypt
            Resource:
              Fn::If:
                - CreatePiiTokenizationKey
                - Fn::GetAtt:
                    - PiiTokenizationKey
                    - Arn
                - Ref: ExistingPiiTokenizationKeyArn
            Condition:
              StringEquals:
                kms:EncryptionContext:gentrail:purpose: pii-tokenization
  # <<< GENERATED pii-kms-policy
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-vpc"}]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-igw"}]
  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 3, 8]]
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-public"}]
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-public-rt"}]
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable
  # Egress-only: the box pulls k3s, the chart, and images outbound and is reached
  # purely over SSM, so it needs no inbound rule (mirrors the dev k3s node SG).
  NodeSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Gentrail appliance node, egress-only, no inbound (SSM-only access).
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: All outbound (image pulls, k3s install, SSM, AWS APIs).
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-node"}]
  DatabaseSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 3, 8]]
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
  DatabaseSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 3, 8]]
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
  DatabaseSubnets:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private database subnets without internet routes
      SubnetIds: [!Ref DatabaseSubnetA, !Ref DatabaseSubnetB]
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL from the application node only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref NodeSecurityGroup
  RdsInstance:
    Type: AWS::RDS::DBInstance
    Metadata:
      cfn-lint:
        config:
          # W3691 mistakes the supported major-only alias for a deprecated minor.
          ignore_checks: [W3691]
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: "16"
      DBInstanceClass: db.t4g.micro
      DBName: gentrail
      MasterUsername: gentrail
      ManageMasterUserPassword: true
      AllocatedStorage: "20"
      MaxAllocatedStorage: 100
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: false
      PubliclyAccessible: false
      BackupRetentionPeriod: !Ref RdsBackupRetentionDays
      DeletionProtection: true
      DBSubnetGroupName: !Ref DatabaseSubnets
      VPCSecurityGroups: [!GetAtt DatabaseSecurityGroup.GroupId]
  EvidenceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ObjectLockEnabled: true
      VersioningConfiguration: {Status: Enabled}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention: {Mode: GOVERNANCE, Days: !Ref EvidenceRetentionDays}
  TraceArchiveBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration: {Status: Enabled}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
  TunnelSecret:
    Type: AWS::SecretsManager::Secret
    Condition: HasTunnel
    Properties:
      Description: Gentrail standard tunnel connector credential
      SecretString: !Ref TunnelToken
  OidcBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
  OidcBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref OidcBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource:
              - !Sub '${OidcBucket.Arn}/.well-known/openid-configuration'
              - !Sub '${OidcBucket.Arn}/openid/v1/jwks'
  WorkloadOidcProvider:
    Type: AWS::IAM::OIDCProvider
    DependsOn: [OidcBucketPolicy, Node]
    Properties:
      Url: !Sub 'https://${OidcBucket}.s3.${AWS::Region}.${AWS::URLSuffix}'
      ClientIdList: [sts.amazonaws.com]
      Tags: [{Key: Name, Value: !Sub '${AWS::StackName}-workloads'}]
  NodeBootstrapPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: standard-bootstrap
      Roles: [!Ref NodeRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: s3:PutObject
            Resource:
              - !Sub '${OidcBucket.Arn}/.well-known/openid-configuration'
              - !Sub '${OidcBucket.Arn}/openid/v1/jwks'
          - Effect: Allow
            Action: cloudformation:DescribeStackResource
            Resource: !Ref AWS::StackId
          - !If
            - HasTunnel
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref TunnelSecret
            - !Ref AWS::NoValue
  DashboardIrsaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Fn::Sub:
          - '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Federated":"${WorkloadOidcProvider}"},"Action":"sts:AssumeRoleWithWebIdentity","Condition":{"StringEquals":{"${IssuerHost}:sub":"system:serviceaccount:gentrail:dashboard","${IssuerHost}:aud":"sts.amazonaws.com"}}}]}'
          - IssuerHost: !Sub '${OidcBucket}.s3.${AWS::Region}.${AWS::URLSuffix}'
      Policies:
        - PolicyName: workload
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock-mantle:CreateInference
                Resource: !Sub 'arn:${AWS::Partition}:bedrock-mantle:${AWS::Region}:${AWS::AccountId}:project/default'
                Condition:
                  StringEquals:
                    bedrock-mantle:Model:
                      - openai.gpt-oss-120b
                      - openai.gpt-oss-20b
              - Effect: Allow
                Action: ['s3:ListBucket', 's3:GetBucketLocation']
                Resource: [!GetAtt EvidenceBucket.Arn, !GetAtt TraceArchiveBucket.Arn]
              - Effect: Allow
                Action: ['s3:GetObject', 's3:GetObjectVersion', 's3:PutObject', 's3:PutObjectRetention']
                Resource: [!Sub '${EvidenceBucket.Arn}/*', !Sub '${TraceArchiveBucket.Arn}/*']
  HeadlessIrsaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Fn::Sub:
          - '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Federated":"${WorkloadOidcProvider}"},"Action":"sts:AssumeRoleWithWebIdentity","Condition":{"StringEquals":{"${IssuerHost}:sub":"system:serviceaccount:gentrail:headless","${IssuerHost}:aud":"sts.amazonaws.com"}}}]}'
          - IssuerHost: !Sub '${OidcBucket}.s3.${AWS::Region}.${AWS::URLSuffix}'
      Policies:
        - PolicyName: workload
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock-mantle:CreateInference
                Resource: !Sub 'arn:${AWS::Partition}:bedrock-mantle:${AWS::Region}:${AWS::AccountId}:project/default'
                Condition:
                  StringEquals:
                    bedrock-mantle:Model:
                      - openai.gpt-oss-120b
                      - openai.gpt-oss-20b
              - Effect: Allow
                Action: ['s3:ListBucket', 's3:GetBucketLocation']
                Resource: [!GetAtt EvidenceBucket.Arn, !GetAtt TraceArchiveBucket.Arn]
              - Effect: Allow
                Action: ['s3:GetObject', 's3:GetObjectVersion', 's3:PutObject', 's3:PutObjectRetention']
                Resource: [!Sub '${EvidenceBucket.Arn}/*', !Sub '${TraceArchiveBucket.Arn}/*']
  PolicyEngineIrsaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Fn::Sub:
          - '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Federated":"${WorkloadOidcProvider}"},"Action":"sts:AssumeRoleWithWebIdentity","Condition":{"StringEquals":{"${IssuerHost}:sub":"system:serviceaccount:gentrail:policy-engine","${IssuerHost}:aud":"sts.amazonaws.com"}}}]}'
          - IssuerHost: !Sub '${OidcBucket}.s3.${AWS::Region}.${AWS::URLSuffix}'
      Policies:
        - PolicyName: workload
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock-mantle:CreateInference
                Resource: !Sub 'arn:${AWS::Partition}:bedrock-mantle:${AWS::Region}:${AWS::AccountId}:project/default'
                Condition:
                  StringEquals:
                    bedrock-mantle:Model:
                      - nvidia.nemotron-super-3-120b
                      - google.gemma-4-31b
  RdsBootstrapIrsaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Fn::Sub:
          - '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Federated":"${WorkloadOidcProvider}"},"Action":"sts:AssumeRoleWithWebIdentity","Condition":{"StringEquals":{"${IssuerHost}:sub":"system:serviceaccount:gentrail:rds-secret-bootstrap","${IssuerHost}:aud":"sts.amazonaws.com"}}}]}'
          - IssuerHost: !Sub '${OidcBucket}.s3.${AWS::Region}.${AWS::URLSuffix}'
      Policies:
        - PolicyName: workload
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !GetAtt RdsInstance.MasterUserSecret.SecretArn
  NodeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-node"}]
  NodeInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref NodeRole]
  Node:
    Type: AWS::EC2::Instance
    DependsOn: [NodeBootstrapPolicy, OidcBucketPolicy, PublicSubnetRouteTableAssociation, PublicDefaultRoute]
    Properties:
      ImageId: !Ref LatestAl2023Ami
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref NodeInstanceProfile
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref NodeSecurityGroup]
      MetadataOptions:
        HttpPutResponseHopLimit: 1
        HttpTokens: required
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref RootVolumeSizeGiB
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-appliance"}]
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            set -euxo pipefail
            exec > /var/log/gentrail-install.log 2>&1

            dnf install -y git tar gzip awscli-2 aws-cfn-bootstrap
            signal() { /opt/aws/bin/cfn-signal --exit-code "$1" --stack ${AWS::StackName} --resource Node --region ${AWS::Region} || true; }
            # Any failure below signals the stack so it rolls back fast instead of waiting out the timeout.
            trap 'signal 1' ERR

            # k3s single-node server; traefik + servicelb disabled to mirror the dev
            # recipe, local-path-provisioner stays for the PVCs. OIDC keys are public;
            # signing keys stay on the encrypted node volume.
            # systemd-resolved's stub resolv.conf (127.0.0.53) makes coredns loop-detect and
            # crash-loop (breaking cluster DNS), so point k3s at the real uplink resolv.conf.
            RESOLV=""
            [ -f /run/systemd/resolve/resolv.conf ] && RESOLV="--resolv-conf /run/systemd/resolve/resolv.conf"
            curl -sfL https://get.k3s.io | \
              INSTALL_K3S_EXEC="server --disable traefik --disable servicelb --write-kubeconfig-mode 0600 --kube-apiserver-arg=service-account-issuer=https://${OidcBucket}.s3.${AWS::Region}.${AWS::URLSuffix} --kube-apiserver-arg=service-account-jwks-uri=https://${OidcBucket}.s3.${AWS::Region}.${AWS::URLSuffix}/openid/v1/jwks $RESOLV" sh -
            until k3s kubectl get --raw /readyz >/dev/null 2>&1; do sleep 2; done
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            # Refresh public verification keys on every k3s restart, including
            # after signing-key rotation. Publication failure fails the restart.
            cat > /usr/local/bin/gentrail-publish-oidc <<'OIDC'
            #!/bin/bash
            set -euo pipefail
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            for attempt in $(seq 1 90); do
              if k3s kubectl get --raw /openid/v1/jwks > /run/gentrail-jwks.json; then break; fi
              sleep 2
            done
            test -s /run/gentrail-jwks.json
            printf '%s' '{"issuer":"https://${OidcBucket}.s3.${AWS::Region}.${AWS::URLSuffix}","jwks_uri":"https://${OidcBucket}.s3.${AWS::Region}.${AWS::URLSuffix}/openid/v1/jwks","authorization_endpoint":"urn:kubernetes:programmatic_authorization","response_types_supported":["id_token"],"subject_types_supported":["public"],"id_token_signing_alg_values_supported":["RS256"]}' > /run/gentrail-openid-configuration
            aws s3 cp /run/gentrail-jwks.json 's3://${OidcBucket}/openid/v1/jwks' --content-type application/json --region ${AWS::Region}
            aws s3 cp /run/gentrail-openid-configuration 's3://${OidcBucket}/.well-known/openid-configuration' --content-type application/json --region ${AWS::Region}
            OIDC
            chmod 700 /usr/local/bin/gentrail-publish-oidc
            mkdir -p /etc/systemd/system/k3s.service.d
            printf '[Service]\nExecStartPost=/usr/local/bin/gentrail-publish-oidc\n' > /etc/systemd/system/k3s.service.d/oidc.conf
            systemctl daemon-reload
            /usr/local/bin/gentrail-publish-oidc

            # k3s applies its bundled add-ons just after /readyz, and local-path-provisioner
            # can crash-loop if it starts before the pod network settles, leaving every PVC
            # unbound. Wait for it to exist, then for Available; restart if it is crash-looping,
            # so the StatefulSet volumes bind under helm --wait.
            until k3s kubectl -n kube-system get deploy local-path-provisioner >/dev/null 2>&1; do sleep 3; done
            k3s kubectl -n kube-system rollout status deploy/local-path-provisioner --timeout=90s \
              || k3s kubectl -n kube-system rollout restart deploy/local-path-provisioner
            k3s kubectl -n kube-system rollout status deploy/local-path-provisioner --timeout=300s

            curl -sfL https://get.helm.sh/helm-v3.15.4-linux-arm64.tar.gz | tar -xz -C /tmp
            install -m 0755 /tmp/linux-arm64/helm /usr/local/bin/helm

            # The license is written to a 0600 root-only file (not baked into a script
            # or passed on the helm command line) so it never lands in the world and
            # never reaches SSM-retained command output. xtrace is off around the write.
            mkdir -p /opt/gentrail
            set +x
            ${LicenseWrite}
            ${TunnelWrite}
            set -x

            # fetch.sh + install.sh are baked once and either run inline below
            # (SelfInstall=true, the bash installer) or triggered over SSM by the
            # gentrail CLI (SelfInstall=false) so the install renders as discrete steps.
            # Each re-exports KUBECONFIG because the CLI runs them as separate SSM
            # invocations sharing no shell state. The script bash vars stay brace-free so
            # CFN !Sub leaves them alone and only substitutes RepoBranch / PublicRepoUrl.
            cat > /opt/gentrail/fetch.sh <<'FETCH'
            #!/bin/bash
            set -euo pipefail
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            SRC=/opt/gentrail/src
            rm -rf "$SRC"
            git clone --depth 1 --branch "${RepoBranch}" "${PublicRepoUrl}" "$SRC"
            k3s kubectl create namespace gentrail --dry-run=client -o yaml | k3s kubectl apply -f -
            FETCH
            cat > /opt/gentrail/install.sh <<'INSTALL'
            #!/bin/bash
            set -euo pipefail
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            CHART=/opt/gentrail/src/charts/gentrail
            DASHBOARD_ROLE=$(aws cloudformation describe-stack-resource --stack-name "${AWS::StackName}" --logical-resource-id DashboardIrsaRole --region ${AWS::Region} --query StackResourceDetail.PhysicalResourceId --output text)
            HEADLESS_ROLE=$(aws cloudformation describe-stack-resource --stack-name "${AWS::StackName}" --logical-resource-id HeadlessIrsaRole --region ${AWS::Region} --query StackResourceDetail.PhysicalResourceId --output text)
            EXTRACTOR_ROLE=$(aws cloudformation describe-stack-resource --stack-name "${AWS::StackName}" --logical-resource-id PolicyEngineIrsaRole --region ${AWS::Region} --query StackResourceDetail.PhysicalResourceId --output text)
            BOOTSTRAP_ROLE=$(aws cloudformation describe-stack-resource --stack-name "${AWS::StackName}" --logical-resource-id RdsBootstrapIrsaRole --region ${AWS::Region} --query StackResourceDetail.PhysicalResourceId --output text)
            TUNNEL_SET=""
            if [ -s /opt/gentrail/tunnel.token ]; then
              k3s kubectl -n gentrail create secret generic gentrail-cloudflared --from-file=token=/opt/gentrail/tunnel.token --dry-run=client -o yaml | k3s kubectl apply -f -
              TUNNEL_SET="--set cloudflared.enabled=true --set cloudflared.replicaCount=1"
            fi
            LICENSE_SET=""
            if [ -f /opt/gentrail/license.jwt ]; then LICENSE_SET="--set-file license.jwt=/opt/gentrail/license.jwt"; fi
            helm upgrade --install gentrail "$CHART" --namespace gentrail -f "$CHART/values-standard.yaml" --set createNamespace=false --set aws.region=${AWS::Region} --set rds.endpoint=${RdsInstance.Endpoint.Address}:${RdsInstance.Endpoint.Port} --set rds.secretArn=${RdsInstance.MasterUserSecret.SecretArn} --set s3.evidenceBucket=${EvidenceBucket} --set s3.traceArchiveBucket=${TraceArchiveBucket} --set dashboard.piiKmsKeyArn=${PiiTokenizationKeyArn} --set dashboard.piiKmsRegion=${PiiTokenizationKeyRegion} --set irsa.dashboard=arn:${AWS::Partition}:iam::${AWS::AccountId}:role/$DASHBOARD_ROLE --set irsa.headless=arn:${AWS::Partition}:iam::${AWS::AccountId}:role/$HEADLESS_ROLE --set irsa.policyEngine=arn:${AWS::Partition}:iam::${AWS::AccountId}:role/$EXTRACTOR_ROLE --set irsa.rdsBootstrap=arn:${AWS::Partition}:iam::${AWS::AccountId}:role/$BOOTSTRAP_ROLE $LICENSE_SET $TUNNEL_SET --wait --wait-for-jobs --timeout 15m
            INSTALL
            chmod 600 /opt/gentrail/fetch.sh /opt/gentrail/install.sh

            # The issuer cannot be registered until its discovery document
            # exists. Signal bare-node readiness first, then CFN creates roles.
            trap - ERR
            signal 0
            if [ "${SelfInstall}" = "true" ]; then
              application_signal() {
                set +x
                /opt/aws/bin/cfn-signal --exit-code "$1" '${ApplicationReadySignal}'
              }
              trap 'application_signal 1' ERR
              READY=false
              for attempt in $(seq 1 120); do
                READY=true
                for resource in DashboardPiiKmsPolicy DashboardIrsaRole HeadlessIrsaRole PolicyEngineIrsaRole RdsBootstrapIrsaRole; do
                  STATE=$(aws cloudformation describe-stack-resource --stack-name '${AWS::StackName}' --logical-resource-id "$resource" --region ${AWS::Region} --query StackResourceDetail.ResourceStatus --output text 2>/dev/null || true)
                  if [ "$STATE" != CREATE_COMPLETE ]; then READY=false; fi
                done
                if [ "$READY" = true ]; then break; fi
                sleep 5
              done
              test "$READY" = true
              bash /opt/gentrail/fetch.sh
              bash /opt/gentrail/install.sh
              application_signal 0
              trap - ERR
            fi
            echo "gentrail appliance bootstrap complete (SelfInstall=${SelfInstall})"
          - ApplicationReadySignal: !If [SelfInstallEnabled, !Ref ApplicationReadyHandle, ""]
            PiiTokenizationKeyArn: !If [CreatePiiTokenizationKey, !GetAtt PiiTokenizationKey.Arn, !Ref ExistingPiiTokenizationKeyArn]
            PiiTokenizationKeyRegion: !If [CreatePiiTokenizationKey, !Ref 'AWS::Region', !Select [3, !Split [':', !Ref ExistingPiiTokenizationKeyArn]]]
            TunnelWrite: !If
              - HasTunnel
              - !Sub '( umask 077; TOKEN=$(aws secretsmanager get-secret-value --region "${AWS::Region}" --secret-id "${TunnelSecret}" --query SecretString --output text); printf "%s" "$TOKEN" > /opt/gentrail/tunnel.token )'
              - "true"
            LicenseWrite: !If
              - HasLicense
              - !Sub '( umask 077; printf "%s" "${LicenseJwt}" > /opt/gentrail/license.jwt )'
              - "true"
    CreationPolicy:
      ResourceSignal:
        Timeout: PT20M
        Count: 1
  ApplicationReadyHandle:
    Type: AWS::CloudFormation::WaitConditionHandle
    Condition: SelfInstallEnabled
  ApplicationReady:
    Type: AWS::CloudFormation::WaitCondition
    Condition: SelfInstallEnabled
    DependsOn: [DashboardPiiKmsPolicy, HeadlessIrsaRole, PolicyEngineIrsaRole, RdsBootstrapIrsaRole]
    Properties:
      Handle: !Ref ApplicationReadyHandle
      Timeout: '1200'
      Count: 1
Outputs:
  PiiTokenizationKeyArn:
    Value: !If [CreatePiiTokenizationKey, !GetAtt PiiTokenizationKey.Arn, !Ref ExistingPiiTokenizationKeyArn]
  InstanceId:
    Description: Appliance node instance id (gentrail connect / teardown reach it over SSM).
    Value: !Ref Node
  Tier:
    Description: Standard single-node installation profile.
    Value: standard
  ConnectHint:
    Description: How to reach the dashboard.
    Value: "Run gentrail connect: it SSM-tunnels the dashboard to http://localhost:8001"
  RdsInstanceId:
    Value: !Ref RdsInstance
  EvidenceBucketName:
    Value: !Ref EvidenceBucket
  TraceArchiveBucketName:
    Value: !Ref TraceArchiveBucket
  OidcBucketName:
    Description: Public OIDC verification documents; cleared automatically before teardown.
    Value: !Ref OidcBucket
