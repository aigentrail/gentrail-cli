{{- if .Values.marketingConsole.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketing-console
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "gentrail.labels" (merge (dict "component" "marketing-console") .) | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
{{ include "gentrail.selectorLabels" (merge (dict "component" "marketing-console") .) | indent 6 }}
  template:
    metadata:
      labels:
{{ include "gentrail.selectorLabels" (merge (dict "component" "marketing-console") .) | indent 8 }}
    spec:
      serviceAccountName: marketing-console
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
{{ include "gentrail.imagePullSecrets" . | indent 6 }}
      containers:
        - name: marketing-console
          image: {{ include "gentrail.image" (merge (dict "component" "marketing-console") .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.marketingConsole.port }}
          env:
            - name: MARKETING_CONSOLE_ADDR
              value: {{ printf ":%v" .Values.marketingConsole.port | quote }}
            - name: LINKS_GATEWAY_URL
              value: {{ .Values.marketingConsole.gatewayUrl | quote }}
            - name: LINKS_ADMIN_SECRET_PARAM
              value: {{ .Values.marketingConsole.adminSecretParam | quote }}
            - name: LINKS_PUBLIC_BASE
              value: {{ .Values.marketingConsole.publicBase | quote }}
            {{- if .Values.marketingConsole.shortBase }}
            - name: LINKS_SHORT_BASE
              value: {{ .Values.marketingConsole.shortBase | quote }}
            {{- end }}
            - name: AWS_REGION
              value: {{ .Values.aws.region | quote }}
            - name: AUTHENTICATION_CONFIG_FILE
              value: /etc/gentrail-auth/config/authentication.json
            - name: AUTHENTICATION_SECRETS_DIR
              value: /etc/gentrail-auth/client-secrets
            - name: AUTHENTICATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "marketingConsole.authenticationSecretName is required" .Values.marketingConsole.authenticationSecretName }}
                  key: database-url
            {{- if and .Values.irsa.marketingConsole (eq .Values.mode "k3s") }}
{{- include "gentrail.irsaEnv" .Values.irsa.marketingConsole | nindent 12 }}
            {{- end }}
          resources: {{- toYaml .Values.marketingConsole.resources | nindent 12 }}
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: authentication-configuration
              mountPath: /etc/gentrail-auth/config
              readOnly: true
            - name: authentication-client
              mountPath: /etc/gentrail-auth/client-secrets
              readOnly: true
            {{- if and .Values.irsa.marketingConsole (eq .Values.mode "k3s") }}
{{- include "gentrail.irsaTokenMount" . | nindent 12 }}
            {{- end }}
      volumes:
        - name: authentication-configuration
          secret:
            secretName: {{ .Values.marketingConsole.authenticationSecretName }}
            defaultMode: 0440
            items:
              - key: authentication.json
                path: authentication.json
        - name: authentication-client
          secret:
            secretName: {{ .Values.marketingConsole.authenticationSecretName }}
            defaultMode: 0440
            items:
              - key: client-secret
                path: client-secret
        {{- if and .Values.irsa.marketingConsole (eq .Values.mode "k3s") }}
{{- include "gentrail.irsaTokenVolume" . | nindent 8 }}
        {{- end }}
{{- end }}
