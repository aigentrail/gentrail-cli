{{- if .Values.evaluator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluator
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "gentrail.labels" (merge (dict "component" "evaluator") .) | indent 4 }}
spec:
  replicas: {{ .Values.evaluator.replicaCount }}
  selector:
    matchLabels:
{{ include "gentrail.selectorLabels" (merge (dict "component" "evaluator") .) | indent 6 }}
  template:
    metadata:
      annotations:
        checksum/nats-identity: {{ include "gentrail.natsMaterial" . | sha256sum }}
      labels:
{{ include "gentrail.selectorLabels" (merge (dict "component" "evaluator") .) | indent 8 }}
    spec:
      serviceAccountName: evaluator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
{{ include "gentrail.imagePullSecrets" . | indent 6 }}
      containers:
        - name: evaluator
          image: {{ include "gentrail.image" (merge (dict "component" "evaluator") .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: health
              containerPort: 8080
          env:
            - name: EVENT_BUS
              value: nats
{{- include "gentrail.natsClientEnv" . | nindent 12 }}
            - name: NATS_URL
              value: "tls://nats:4222"
            - name: NATS_STREAM_REPLICAS
              value: {{ .Values.nats.replicas | quote }}
{{ include "gentrail.ruleStorageEnv" . | indent 12 }}
{{ include "gentrail.traceStorageEnv" . | indent 12 }}
{{- include "gentrail.licenseEnv" . | nindent 12 }}

          resources: {{- toYaml .Values.evaluator.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /livez, port: health }
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
{{- include "gentrail.natsClientMount" . | nindent 12 }}
{{- include "gentrail.licenseMount" . | nindent 12 }}

      volumes:
{{- include "gentrail.natsClientVolume" (dict "role" "evaluator") | nindent 8 }}
{{- include "gentrail.licenseVolume" . | nindent 8 }}


{{- end }}
