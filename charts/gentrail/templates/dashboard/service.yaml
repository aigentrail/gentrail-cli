{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "gentrail.labels" (merge (dict "component" "dashboard") .) | indent 4 }}
spec:
  type: {{ if .Values.privateWorkloadEndpoint.enabled }}NodePort{{ else }}ClusterIP{{ end }}
  {{- if .Values.privateWorkloadEndpoint.enabled }}
  externalTrafficPolicy: Local
  {{- end }}
  ports:
    - port: 8001
      targetPort: http
      name: http
      {{- if .Values.privateWorkloadEndpoint.enabled }}
      nodePort: 30001
      {{- end }}
  selector:
{{ include "gentrail.selectorLabels" (merge (dict "component" "dashboard") .) | indent 4 }}

{{- end }}
