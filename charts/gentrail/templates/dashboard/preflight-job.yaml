{{- if and .Values.dashboard.enabled .Values.dashboard.preflight }}
apiVersion: batch/v1
kind: Job
metadata:
  name: dashboard-preflight
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: 120
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gentrail-deployment-check
        app.kubernetes.io/component: dashboard
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
{{ include "gentrail.imagePullSecrets" . | indent 6 }}
      containers:
        - name: verify
          image: {{ include "gentrail.image" (merge (dict "component" "dashboard") .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/dashboard-verify"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gentrail-rds-secret
                  key: dsn
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { cpu: "1", memory: 256Mi }
{{- end }}
