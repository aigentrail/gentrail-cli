{{- if .Values.authproxy.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: authproxy
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "gentrail.labels" (merge (dict "component" "authproxy") .) | indent 4 }}
spec:
  type: {{ if .Values.privateWorkloadEndpoint.enabled }}NodePort{{ else }}ClusterIP{{ end }}
  {{- if .Values.privateWorkloadEndpoint.enabled }}
  externalTrafficPolicy: Local
  {{- end }}
  ports:
    - port: 4318
      targetPort: otlp
      name: otlp
      {{- if .Values.privateWorkloadEndpoint.enabled }}
      nodePort: 30318
      {{- end }}
  selector:
{{ include "gentrail.selectorLabels" (merge (dict "component" "authproxy") .) | indent 4 }}

{{- end }}
