{{- if .Values.authproxy.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authproxy
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "gentrail.labels" (merge (dict "component" "authproxy") .) | indent 4 }}
spec:
  replicas: {{ .Values.authproxy.replicaCount }}
  selector:
    matchLabels:
{{ include "gentrail.selectorLabels" (merge (dict "component" "authproxy") .) | indent 6 }}
  template:
    metadata:
      labels:
{{ include "gentrail.selectorLabels" (merge (dict "component" "authproxy") .) | indent 8 }}
    spec:
      serviceAccountName: authproxy
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
{{ include "gentrail.imagePullSecrets" . | indent 6 }}
      containers:
        - name: authproxy
          image: {{ include "gentrail.image" (merge (dict "component" "authproxy") .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: otlp
              containerPort: 4318
          env:
            - name: PORT
              value: "4318"
            - name: EVENT_BUS
              value: nats
            - name: NATS_URL
              value: "nats://nats:4222"
            - name: NATS_STREAM_REPLICAS
              value: {{ .Values.nats.replicas | quote }}
{{ include "gentrail.traceStorageEnv" . | indent 12 }}
            - name: CREDENTIALS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gentrail-rds-secret
                  key: dsn
{{- include "gentrail.licenseEnv" . | nindent 12 }}
          resources: {{- toYaml .Values.authproxy.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /healthz, port: otlp }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: otlp }
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
{{- include "gentrail.licenseMount" . | nindent 12 }}
      volumes:
{{- include "gentrail.licenseVolume" . | nindent 8 }}

{{- end }}
