{{- if and (not .Values.local.enabled) .Values.rds.secretArn (or (eq .Values.mode "eks") .Values.rds.bootstrap) }}
# One-shot Job that reads the RDS master password from Secrets Manager (using
# the `dashboard` SA's IRSA permissions) and writes a K8s Secret named
# gentrail-rds-secret with key `dsn` shaped for Go's database/sql DATABASE_URL.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rds-secret-bootstrap
  namespace: {{ .Release.Namespace }}
  annotations:
{{- if .Values.irsa.rdsBootstrap }}
    eks.amazonaws.com/role-arn: {{ .Values.irsa.rdsBootstrap | quote }}
{{- end }}
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rds-secret-bootstrap
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rds-secret-bootstrap
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rds-secret-bootstrap
subjects:
  - kind: ServiceAccount
    name: rds-secret-bootstrap
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rds-secret-bootstrap
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 60
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/component: rds-secret-bootstrap
    spec:
      serviceAccountName: rds-secret-bootstrap
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: public.ecr.aws/aws-cli/aws-cli@sha256:eccdb3ec77e159d43ca6a750a70738c546883138be7f094498294a1477ec7e42
          env:
            - name: AWS_REGION
              value: {{ .Values.aws.region | quote }}
            - name: RDS_SECRET_ARN
              value: {{ .Values.rds.secretArn | quote }}
            - name: RDS_INSTANCE_ID
              value: {{ .Values.rds.instanceId | quote }}
            - name: RDS_ENDPOINT
              value: {{ .Values.rds.endpoint | quote }}
            - name: NS
              value: {{ .Release.Namespace | quote }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              umask 077
              WORK_DIRECTORY=$(mktemp -d)
              trap 'rm -f "$WORK_DIRECTORY/secret.json" "$WORK_DIRECTORY/resp.json"; rmdir "$WORK_DIRECTORY"' EXIT
              PASSWORD=$(aws secretsmanager get-secret-value --secret-id "$RDS_SECRET_ARN" \
                --query SecretString --output text | jq -er '.password | select(type == "string" and length > 0) | @uri')
              [ -n "$PASSWORD" ] || exit 1
              if [ -n "$RDS_INSTANCE_ID" ]; then
                for i in $(seq 1 44); do
                  STATE=$(aws rds describe-db-instances --db-instance-identifier "$RDS_INSTANCE_ID" \
                    --query "DBInstances[0].DBInstanceStatus" --output text)
                  [ "$STATE" = available ] && break
                  echo "rds $RDS_INSTANCE_ID is $STATE; waiting ($i)"; sleep 15
                done
                [ "$STATE" = available ] || exit 1
                RDS_ENDPOINT=$(aws rds describe-db-instances --db-instance-identifier "$RDS_INSTANCE_ID" \
                  --query "DBInstances[0].[Endpoint.Address,Endpoint.Port]" --output text | tr "\t" ":")
              fi
              HOST="${RDS_ENDPOINT%:*}"
              PORT="${RDS_ENDPOINT##*:}"
              DSN="postgres://gentrail:${PASSWORD}@${HOST}:${PORT}/gentrail?sslmode=require"
              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              cat > "$WORK_DIRECTORY/secret.json" <<JSON
              {"apiVersion":"v1","kind":"Secret","metadata":{"name":"gentrail-rds-secret","namespace":"${NS}"},"type":"Opaque","stringData":{"dsn":"${DSN}"}}
              JSON
              STATUS=$(curl --silent --show-error --connect-timeout 5 --max-time 30 --cacert "$CA" -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type: application/json" \
                -X POST "https://kubernetes.default/api/v1/namespaces/${NS}/secrets" \
                --data @"$WORK_DIRECTORY/secret.json" --output "$WORK_DIRECTORY/resp.json" --write-out '%{http_code}')
              case "$STATUS" in
                201) echo "database connection secret created" ;;
                409)
                  curl --fail --silent --show-error --connect-timeout 5 --max-time 30 --cacert "$CA" -H "Authorization: Bearer $TOKEN" \
                    -H "Content-Type: application/strategic-merge-patch+json" \
                    -X PATCH "https://kubernetes.default/api/v1/namespaces/${NS}/secrets/gentrail-rds-secret" \
                    --data @"$WORK_DIRECTORY/secret.json" --output "$WORK_DIRECTORY/resp.json"
                  echo "database connection secret updated"
                  ;;
                *) printf 'database connection secret rejected (HTTP %s)\n' "$STATUS" >&2; exit 1 ;;
              esac
{{- end }}
