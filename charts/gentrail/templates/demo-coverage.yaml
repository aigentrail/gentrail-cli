{{- if .Values.demoWorkload.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: demo-coverage
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "gentrail.labels" (merge (dict "component" "demo-workload") .) | indent 4 }}
spec:
  schedule: "17 9-17 * * 1-5"
  timeZone: {{ (.Values.demoWorkload.config | fromJson).timezone | quote }}
  suspend: {{ .Values.demoWorkload.paused }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/component: demo-workload
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile: {type: RuntimeDefault}
          {{- if .Values.demoWorkload.imagePullSecret }}
          imagePullSecrets:
            - name: {{ .Values.demoWorkload.imagePullSecret }}
          {{- else }}
{{ include "gentrail.imagePullSecrets" . | indent 10 }}
          {{- end }}
          containers:
            - name: coverage
              image: {{ include "gentrail.image" (merge (dict "component" "sidecar") .) }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: [/bin/workload]
              args: [--mode=coverage]
              env:
                - name: DEMO_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.demoWorkload.apiKeySecretName }}
                      key: api-key
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
              resources:
{{ toYaml .Values.demoWorkload.resources | indent 16 }}
              volumeMounts:
                - {name: config, mountPath: /config, readOnly: true}
          volumes:
            - name: config
              configMap: {name: demo-workload}
{{- end }}
