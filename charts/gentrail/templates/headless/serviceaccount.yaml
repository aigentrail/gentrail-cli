{{- if and .Values.headless.enabled (or .Values.headless.notifications.enabled .Values.headless.classification.enabled .Values.headless.auditCapture.enabled) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headless
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "gentrail.labels" (merge (dict "component" "headless") .) | indent 4 }}
{{- if not .Values.headless.useInstanceProfile }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.irsa.headless | quote }}
{{- end }}
{{- end }}
