{{- $compositionJSON := .Files.Get "files/headless-composition.json" }}
{{- $composition := $compositionJSON | mustFromJson }}
{{- $compositionSHA256 := $compositionJSON | sha256sum }}
{{- if ne (toJson $composition.version) "1" }}
{{- fail "unsupported headless composition contract version" }}
{{- end }}
{{- $modules := .Values.headless.modules }}
{{- $capture := .Values.headless.auditCapture.enabled }}
{{- $integrationCommands := .Values.headless.integrationCommands.enabled }}
{{- $recovery := .Values.headless.auditRecovery.enabled }}
{{- $scheduled := .Values.headless.scheduledScans.enabled }}
{{- if and (or .Values.headless.auditRefresh.enabled .Values.headless.auditMonitoring.enabled $recovery $scheduled) (not .Values.headless.enabled) }}
{{- fail "audit and scan workers require headless.enabled" }}
{{- end }}
{{- if and (or .Values.headless.auditRefresh.enabled $recovery) (not .Values.headless.companySignIn) (not (hasPrefix "https://" .Values.dashboard.baseUrl)) }}
{{- fail "audit commands require shared company sign-in or an HTTPS dashboard base URL" }}
{{- end }}
{{- if or $recovery $scheduled }}
{{- $modules = uniq (append $modules "integrations") }}
{{- end }}
{{- $cloud := or .Values.headless.notifications.enabled .Values.headless.classification.enabled $capture $integrationCommands $recovery $scheduled }}
{{- if and .Values.headless.enabled .Values.headless.routeApplications .Values.dashboard.enabled (hasPrefix "https://" .Values.dashboard.baseUrl) }}
{{- if ne (toJson .Values.dashboard.companySignIn) (toJson .Values.headless.companySignIn) }}
{{- fail "routed human authentication requires the same company sign-in configuration" }}
{{- end }}
{{- end }}
{{- if $integrationCommands }}
{{- if not (has "integrations" $modules) }}
{{- fail "integration commands require the integrations module" }}
{{- end }}
{{- $_ := required "integration commands require an ingestion endpoint" .Values.headless.integrationCommands.ingestionEndpoint }}
{{- if and .Values.dashboard.enabled .Values.headless.routeApplications }}
{{- if or .Values.dashboard.companySignIn .Values.headless.companySignIn }}
{{- if ne (toJson .Values.dashboard.companySignIn) (toJson .Values.headless.companySignIn) }}
{{- fail "routed integration commands require the same company sign-in configuration" }}
{{- end }}
{{- else if not (hasPrefix "https://" .Values.dashboard.baseUrl) }}
{{- fail "routed integration commands require shared company sign-in or an HTTPS dashboard base URL" }}
{{- end }}
{{- end }}
{{- end }}
{{- if $capture }}
{{- if and (not .Values.headless.companySignIn) (not (hasPrefix "https://" .Values.dashboard.baseUrl)) }}
{{- fail "audit capture requires shared company sign-in or an HTTPS dashboard base URL" }}
{{- end }}
{{- if not (index (.Values.image.references | default dict) "audit-capture-worker") }}
{{- fail "audit capture requires image.references.audit-capture-worker pinned to a digest" }}
{{- end }}
{{- if eq .Values.headless.auditCapture.evidenceStorage "s3" }}
{{- $_ := required "S3 audit capture requires s3.evidenceBucket" .Values.s3.evidenceBucket }}
{{- end }}
{{- $modules = uniq (concat $modules $composition.auditCapture.adds) }}
{{- end }}
{{- $manualScans := and $integrationCommands (or .Values.headless.companySignIn (hasPrefix "https://" .Values.dashboard.baseUrl)) (has "rules" $modules) }}
{{- $scanEvidence := or $capture $manualScans $recovery $scheduled }}
{{- if and $scheduled (eq .Values.headless.auditCapture.evidenceStorage "s3") }}
{{- $_ := required "S3 scheduled scans require s3.evidenceBucket" .Values.s3.evidenceBucket }}
{{- end }}
{{- if and $recovery (eq .Values.headless.auditCapture.evidenceStorage "s3") }}
{{- $_ := required "S3 audit recovery requires s3.evidenceBucket" .Values.s3.evidenceBucket }}
{{- end }}
{{- if and $manualScans (not $capture) (eq .Values.headless.auditCapture.evidenceStorage "s3") }}
{{- $_ := required "S3 manual scans require s3.evidenceBucket" .Values.s3.evidenceBucket }}
{{- end }}
{{- if and .Values.headless.companySignIn (not .Values.headless.enabled) }}
{{- fail "headless company sign-in requires headless.enabled" }}
{{- end }}
{{- if $cloud }}
{{- if not .Values.headless.enabled }}
{{- fail "headless cloud workers require headless.enabled" }}
{{- end }}
{{- $_ := required "headless cloud workers require an approved irsa.headless role" .Values.irsa.headless }}
{{- end }}
{{- if and .Values.headless.credentialRecovery.enabled (not .Values.headless.enabled) }}
{{- fail "headless credential recovery requires headless.enabled" }}
{{- end }}
{{- if .Values.headless.compliance.enabled }}
{{- if not .Values.headless.enabled }}
{{- fail "headless compliance reactions require headless.enabled" }}
{{- end }}
{{- end }}
{{- if .Values.headless.notifications.enabled }}
{{- if not .Values.headless.enabled }}
{{- fail "headless notification delivery requires headless.enabled" }}
{{- end }}
{{- $_ := required "headless notification sender is required" .Values.headless.notifications.from }}
{{- $_ := required "headless notification region is required" (default .Values.aws.region .Values.headless.notifications.region) }}

{{- end }}
{{- if .Values.headless.routeApplications }}
{{- if not .Values.headless.enabled }}
{{- fail "routing application APIs requires headless.enabled" }}
{{- end }}
{{- $modules = uniq (concat $modules $composition.dashboardRouting.adds) }}
{{- range $required := $composition.dashboardRouting.requires }}
{{- if not (has $required $modules) }}
{{- fail "dashboard application routing requires rules, policy, policy-groups, findings and approvals" }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.headless.enabled }}
{{- $resources := dict }}
{{- if ne (toJson $composition.foundation.version) "1" }}
{{- fail "unsupported headless foundation contract version" }}
{{- end }}
{{- range $resource := $composition.foundation.resources }}
{{- $_ := set $resources $resource true }}
{{- end }}
{{- $workers := list }}
{{- range $selection := list (dict "selected" .Values.headless.auditRefresh.enabled "worker" "audit-refresh") (dict "selected" .Values.headless.auditMonitoring.enabled "worker" "audit-monitoring") (dict "selected" $recovery "worker" "audit-recovery") (dict "selected" $scheduled "worker" "scheduled-scans") }}
{{- if $selection.selected }}
{{- $workers = append $workers $selection.worker }}
{{- end }}
{{- end }}
{{- if or $recovery $scheduled }}
{{- $workers = append $workers "integration-restoration" }}
{{- end }}
{{- if or $recovery $scheduled }}
{{- $workers = concat $workers (list "scan-events" "evidence-recovery") }}
{{- end }}
{{- if $integrationCommands }}
{{- $workers = concat $workers (list "integration-restoration" "integration-commands") }}
{{- end }}
{{- if $manualScans }}
{{- $workers = concat $workers (list "manual-scans" "scan-events" "evidence-recovery") }}
{{- end }}
{{- if $capture }}
{{- $workers = concat $workers (list "audit-capture" "integration-restoration" "scan-events" "evidence-recovery") }}
{{- end }}
{{- if .Values.headless.classification.enabled }}
{{- $workers = append $workers "classification" }}
{{- end }}
{{- if .Values.headless.credentialRecovery.enabled }}
{{- $workers = append $workers "credential-recovery" }}
{{- end }}
{{- if .Values.headless.compliance.enabled }}
{{- $workers = append $workers "compliance" }}
{{- end }}
{{- if .Values.headless.notifications.enabled }}
{{- $workers = append $workers "notifications" }}
{{- end }}
{{- $workers = uniq $workers }}
{{- range $worker := $workers }}
{{- if not (hasKey $composition.workers $worker) }}
{{- fail (printf "unknown headless worker %s" $worker) }}
{{- end }}
{{- $contract := index $composition.workers $worker }}
{{- if ne (toJson $contract.version) "1" }}
{{- fail (printf "unsupported headless worker version for %s" $worker) }}
{{- end }}
{{- range $required := $contract.workers }}
{{- if not (has $required $workers) }}
{{- fail (printf "headless worker %s requires worker %s" $worker $required) }}
{{- end }}
{{- end }}
{{- range $required := $contract.requires }}
{{- if not (has $required $modules) }}
{{- fail (printf "headless worker %s requires %s" $worker $required) }}
{{- end }}
{{- end }}
{{- range $resource := $contract.resources }}
{{- $_ := set $resources $resource true }}
{{- end }}
{{- end }}
{{- if not (index (.Values.image.references | default dict) "headless") }}
{{- fail "enabled headless requires image.references.headless pinned to a digest" }}
{{- end }}
{{- range $module := $modules }}
{{- if not (hasKey $composition.modules $module) }}
{{- fail (printf "unknown headless module %s" $module) }}
{{- end }}
{{- range $resource := (index $composition.modules $module).resources }}
{{- $_ := set $resources $resource true }}
{{- end }}
{{- range $required := (index $composition.modules $module).requires }}
{{- if not (has $required $modules) }}
{{- fail (printf "headless module %s requires %s" $module $required) }}
{{- end }}
{{- end }}
{{- end }}
{{- if has "decisions" $modules }}
{{- if or (ne .Values.headless.databaseSecretName .Values.headless.rulesDatabaseSecretName) (ne .Values.headless.databaseSecretKey .Values.headless.rulesDatabaseSecretKey) }}
{{- fail "execution admission requires application and rule storage to use the same database secret and key" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headless
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "gentrail.labels" (merge (dict "component" "headless") .) | indent 4 }}
spec:
  replicas: {{ .Values.headless.replicaCount }}
  strategy: {type: Recreate}
  selector:
    matchLabels:
{{ include "gentrail.selectorLabels" (merge (dict "component" "headless") .) | indent 6 }}
  template:
    metadata:
      annotations:
        checksum/composition: {{ $compositionSHA256 }}
        checksum/nats-identity: {{ include "gentrail.natsMaterial" . | sha256sum }}
{{- if and $capture (eq .Values.mode "eks") }}
        eks.amazonaws.com/skip-containers: prepare-audit-directory,audit-capture-worker
{{- end }}
      labels:
{{ include "gentrail.selectorLabels" (merge (dict "component" "headless") .) | indent 8 }}
    spec:
{{- if $cloud }}
      serviceAccountName: headless
{{- end }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
{{ include "gentrail.imagePullSecrets" . | indent 6 }}
{{- if $capture }}
      initContainers:
        - name: prepare-audit-directory
          image: {{ include "gentrail.image" (merge (dict "component" "audit-capture-worker") .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [prepare-directory, --directory, /run/gentrail-capture, --user-id, "65532", --group-id, "65532"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL], add: [CHOWN] }
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - name: audit-capture-runtime
              mountPath: /run/gentrail-capture
{{- end }}
      containers:
        - name: headless
          image: {{ include "gentrail.image" (merge (dict "component" "headless") .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          ports:
            - name: http
              containerPort: 8080
          env:
{{- if hasPrefix "https://" .Values.dashboard.baseUrl }}
            - name: AUTHENTICATION_ORIGIN
              value: {{ .Values.dashboard.baseUrl | quote }}
{{- end }}
{{- if $capture }}
            - name: GENTRAIL_AUDIT_CAPTURE_DIRECTORY
              value: /run/gentrail-capture
{{- end }}
{{- range $selection := list (dict "selected" .Values.headless.auditRefresh.enabled "variable" "GENTRAIL_AUDIT_REFRESH") (dict "selected" .Values.headless.auditMonitoring.enabled "variable" "GENTRAIL_AUDIT_MONITORING") (dict "selected" $recovery "variable" "GENTRAIL_AUDIT_RECOVERY") (dict "selected" $scheduled "variable" "GENTRAIL_SCHEDULED_SCANS") }}
{{- if $selection.selected }}
            - name: {{ $selection.variable }}
              value: "true"
{{- end }}
{{- end }}
{{- if or $capture $integrationCommands $recovery $scheduled }}
            - name: GENTRAIL_INTEGRATION_RESTORATION
              value: "true"
{{- end }}
{{- if $integrationCommands }}
            - name: GENTRAIL_INTEGRATION_COMMANDS
              value: "true"
            - name: AIGENTRAIL_INGESTION_ENDPOINT
              value: {{ .Values.headless.integrationCommands.ingestionEndpoint | quote }}
{{- end }}
{{- if $manualScans }}
            - name: GENTRAIL_MANUAL_SCANS
              value: "true"
{{- end }}
{{- if $scanEvidence }}
            - name: GENTRAIL_SCAN_EVIDENCE_RECOVERY
              value: "true"
            - name: GENTRAIL_SCAN_EVENT_DELIVERY
              value: "true"
            - name: GENTRAIL_EVIDENCE_STORAGE
              value: {{ .Values.headless.auditCapture.evidenceStorage | quote }}
{{- if eq .Values.headless.auditCapture.evidenceStorage "s3" }}
            - name: EVIDENCE_BUCKET
              value: {{ .Values.s3.evidenceBucket | quote }}
{{- end }}
{{- end }}
{{- if .Values.headless.companySignIn }}
            - name: AUTHENTICATION_CONFIG_FILE
              value: /var/run/gentrail/authentication/configuration/configuration.json
            - name: AUTHENTICATION_SECRETS_DIR
              value: /var/run/gentrail/authentication/secrets
{{- end }}
{{- if .Values.headless.credentialRecovery.enabled }}
            - name: GENTRAIL_CREDENTIAL_RECOVERY
              value: "true"
{{- end }}
{{- if .Values.headless.compliance.enabled }}
            - name: GENTRAIL_COMPLIANCE_REACTIONS
              value: "true"
{{- end }}
{{- if .Values.headless.notifications.enabled }}
            - name: GENTRAIL_NOTIFICATION_DELIVERY
              value: ses
            - name: AIGENTRAIL_NOTIFICATIONS_SES_FROM
              value: {{ .Values.headless.notifications.from | quote }}
            - name: AIGENTRAIL_NOTIFICATIONS_SES_REGION
              value: {{ default .Values.aws.region .Values.headless.notifications.region | quote }}
{{- end }}
{{- if .Values.headless.classification.enabled }}
            - name: GENTRAIL_TOOL_CLASSIFICATION
              value: bedrock
{{- if .Values.headless.classification.policySecretName }}
            - name: GENTRAIL_AGENT_POLICY_FILE
              value: /var/run/gentrail/classification/policy.json
{{- end }}
{{- end }}
{{- if $cloud }}
            - name: AWS_REGION
              value: {{ required "headless cloud workers require a region" (ternary .Values.aws.region (default .Values.aws.region .Values.headless.notifications.region) (or .Values.headless.classification.enabled $capture $integrationCommands $recovery $scheduled)) | quote }}
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
{{- if and (eq .Values.mode "k3s") }}
{{ include "gentrail.irsaEnv" .Values.irsa.headless | indent 12 }}
{{- end }}
{{- end }}
            - name: HEADLESS_LISTEN_ADDRESS
              value: "0.0.0.0:8080"
            - name: GENTRAIL_MODULES
              value: {{ join "," $modules | quote }}
            - name: GENTRAIL_COMPOSITION_SHA256
              value: {{ $compositionSHA256 | quote }}
{{- if and (has "approvals" $modules) .Values.dashboard.baseUrl }}
            - name: AIGENTRAIL_DASHBOARD_BASE_URL
              value: {{ .Values.dashboard.baseUrl | quote }}
{{- end }}
{{- if hasKey $resources "broker" }}
{{- include "gentrail.natsClientEnv" . | nindent 12 }}
            - name: NATS_URL
              value: "tls://nats:4222"
{{- end }}
{{- if hasKey $resources "application_sql" }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.headless.databaseSecretName }}
                  key: {{ .Values.headless.databaseSecretKey }}
{{- end }}
{{- if hasKey $resources "rules_sql" }}
            - name: RULES_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.headless.rulesDatabaseSecretName }}
                  key: {{ .Values.headless.rulesDatabaseSecretKey }}
{{- end }}
{{- if hasKey $resources "traces_sql" }}
            - name: TRACES_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.headless.tracesDatabaseSecretName }}
                  key: {{ .Values.headless.tracesDatabaseSecretKey }}
{{- end }}
{{- include "gentrail.licenseEnv" . | nindent 12 }}
          resources: {{- toYaml .Values.headless.resources | nindent 12 }}
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
            failureThreshold: 72
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 30
          volumeMounts:
{{- if $capture }}
            - name: audit-capture-runtime
              mountPath: /run/gentrail-capture
{{- end }}
{{- if .Values.headless.companySignIn }}
            - name: headless-authentication-configuration
              mountPath: /var/run/gentrail/authentication/configuration
              readOnly: true
            - name: headless-authentication-secrets
              mountPath: /var/run/gentrail/authentication/secrets
              readOnly: true
{{- end }}
{{- if and .Values.headless.classification.enabled .Values.headless.classification.policySecretName }}
            - name: classification-policy
              mountPath: /var/run/gentrail/classification
              readOnly: true
{{- end }}
{{- if and $cloud (eq .Values.mode "k3s") }}
{{ include "gentrail.irsaTokenMount" . | indent 12 }}
{{- end }}
{{- if hasKey $resources "broker" }}
{{- include "gentrail.natsClientMount" . | nindent 12 }}
{{- end }}
{{- include "gentrail.licenseMount" . | nindent 12 }}
{{- if $capture }}
        - name: audit-capture-worker
          image: {{ include "gentrail.image" (merge (dict "component" "audit-capture-worker") .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.headless.databaseSecretName }}
                  key: {{ .Values.headless.databaseSecretKey }}
            - name: GENTRAIL_AUDIT_CAPTURE_DIRECTORY
              value: /run/gentrail-capture
            - name: GENTRAIL_AUDIT_CAPTURE_SERVER_UID
              value: "65532"
          resources: {{- toYaml .Values.headless.auditCapture.resources | nindent 12 }}
          volumeMounts:
            - name: audit-capture-runtime
              mountPath: /run/gentrail-capture
{{- end }}
      volumes:
{{- if $capture }}
        - name: audit-capture-runtime
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
{{- end }}
{{- if .Values.headless.companySignIn }}
        - name: headless-authentication-configuration
          configMap:
            name: {{ .Values.headless.companySignIn.configurationMapName }}
            items:
              - key: configuration.json
                path: configuration.json
        - name: headless-authentication-secrets
          secret:
            secretName: {{ .Values.headless.companySignIn.clientSecretName }}
            defaultMode: 288
{{- end }}
{{- if and .Values.headless.classification.enabled .Values.headless.classification.policySecretName }}
        - name: classification-policy
          secret:
            secretName: {{ .Values.headless.classification.policySecretName | quote }}
            items:
              - key: policy.json
                path: policy.json
{{- end }}
{{- if and $cloud (eq .Values.mode "k3s") }}
{{ include "gentrail.irsaTokenVolume" . | indent 8 }}
{{- end }}
{{- if hasKey $resources "broker" }}
{{- include "gentrail.natsClientVolume" (dict "role" "headless") | nindent 8 }}
{{- end }}
{{- include "gentrail.licenseVolume" . | nindent 8 }}
{{- end }}
