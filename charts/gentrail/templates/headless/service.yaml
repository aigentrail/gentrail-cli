{{- if .Values.headless.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: headless
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "gentrail.labels" (merge (dict "component" "headless") .) | indent 4 }}
spec:
  type: ClusterIP
  selector:
{{ include "gentrail.selectorLabels" (merge (dict "component" "headless") .) | indent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
