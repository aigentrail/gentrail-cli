{{- if .Values.demoWorkload.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-workload
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "gentrail.labels" (merge (dict "component" "demo-workload") .) | indent 4 }}
data:
  config.json: {{ required "demoWorkload.config is required" .Values.demoWorkload.config | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: demo-workload-state
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "gentrail.labels" (merge (dict "component" "demo-workload") .) | indent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.storage.class }}
  storageClassName: {{ .Values.storage.class | quote }}
  {{- end }}
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-workload
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "gentrail.labels" (merge (dict "component" "demo-workload") .) | indent 4 }}
spec:
  replicas: {{ ternary 0 1 .Values.demoWorkload.paused }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: demo-workload
  template:
    metadata:
      labels:
        app.kubernetes.io/component: demo-workload
      annotations:
        checksum/config: {{ .Values.demoWorkload.config | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      {{- if .Values.demoWorkload.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.demoWorkload.imagePullSecret }}
      {{- else }}
{{ include "gentrail.imagePullSecrets" . | indent 6 }}
      {{- end }}
      containers:
        - name: workload
          image: {{ include "gentrail.image" (merge (dict "component" "sidecar") .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/bin/workload]
          readinessProbe:
            exec:
              command: [/bin/workload, --mode=health]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 2
          env:
            - name: DEMO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.demoWorkload.apiKeySecretName }}
                  key: api-key
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
{{ toYaml .Values.demoWorkload.resources | indent 12 }}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: state, mountPath: /state}
      volumes:
        - name: config
          configMap: {name: demo-workload}
        - name: state
          persistentVolumeClaim: {claimName: demo-workload-state}
{{- if .Values.networkPolicies.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-workload-egress
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "gentrail.labels" (merge (dict "component" "demo-workload") .) | indent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: demo-workload
  policyTypes: [Egress]
  egress:
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: dashboard
      ports: [{port: 8001, protocol: TCP}]
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: authproxy
      ports: [{port: 4318, protocol: TCP}]
{{- end }}
{{- end }}
