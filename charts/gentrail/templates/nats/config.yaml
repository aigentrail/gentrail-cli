{{- $material := include "gentrail.natsMaterial" . | fromJson }}
apiVersion: v1
kind: Secret
metadata:
  name: nats-server
  namespace: {{ .Release.Namespace }}
  annotations:
    gentrail.ai/credential-revision: {{ .Values.nats.credentialRevision | quote }}
type: Opaque
data:
  nats.conf: {{ include "gentrail.natsConfig" . | b64enc | quote }}
{{- range $key, $value := $material }}
  {{ $key }}: {{ $value | b64enc | quote }}
{{- end }}
{{- range $role := list "authproxy" "evaluator" "dashboard" "headless" "operator" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: nats-{{ $role }}
  namespace: {{ $.Release.Namespace }}
type: Opaque
data:
  client.json: {{ dict "user" $role "password" (index $material (printf "%s.password" $role)) | toJson | b64enc | quote }}
  ca.crt: {{ index $material "ca.crt" | b64enc | quote }}
{{- end }}
